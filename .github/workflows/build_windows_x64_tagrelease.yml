name: Build Windows (x64) with Nuitka (Tag Release)

on:
  push:
    tags:
      - '*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Verify Python
        shell: cmd
        run: |
          python --version
          python -c "import struct; print('Python:', struct.calcsize('P') * 8, 'bit')"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test OpenCV
        shell: cmd
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"

      - name: Test NumPy
        shell: cmd
        run: |
          python -c "import numpy; print('NumPy:', numpy.__version__)"

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main

          script-name: oberesizer.py

          mode: standalone

          windows-console-mode: force

          #windows-icon-from-ico: 1000088823.ico

          # include-data-files: |
          #   1000088823.ico=1000088823.ico

          output-dir: build

          assume-yes-for-downloads: true

          jobs: 1

          lto: no

      - name: Archive Windows build
        shell: cmd
        run: |
          tar -czvf oberesizer-Windows-x64-${{ github.ref_name }}.tar.gz -C build .

      - name: Upload Windows x64 build
        uses: softprops/action-gh-release@v2
        with:
          name: oberesizer-Windows-x64-${{ github.ref_name }}
          files: |
            oberesizer-Windows-x64-${{ github.ref_name }}.tar.gz
