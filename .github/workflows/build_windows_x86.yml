name: Build Windows (x86) with Nuitka

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x86"
          cache: pip

      - name: Verify Python
        shell: cmd
        run: |
          python --version
          python -c "import struct; print('Python:', struct.calcsize('P') * 8, 'bit')"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test OpenCV
        shell: cmd
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"

      - name: Test NumPy
        shell: cmd
        run: |
          python -c "import numpy; print('NumPy:', numpy.__version__)"

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main

          script-name: oberesizer.py

          mode: standalone

          windows-console-mode: force

          #windows-icon-from-ico: 1000088823.ico

          # include-data-files: |
          #   1000088823.ico=1000088823.ico

          output-dir: build

          assume-yes-for-downloads: true

          jobs: 1

          lto: no

      - name: Upload Windows x86 build
        uses: actions/upload-artifact@v7
        with:
          name: oberesizer-Windows-x86
          path: |
            build/*.dist/**
            build/*.exe
          include-hidden-files: true
          if-no-files-found: error
          archive: true
